<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="/wp-content/uploads/2021/03/logo.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/wp-content/uploads/2021/03/logo.png" alt="">{{ site.title }}</a>
      <input type="checkbox" id="nav-toggle" hidden>
      <label for="nav-toggle" class="nav-button" aria-label="菜单">☰</label>
      <nav class="site-nav">{% include menu.html items=site.data.menu %}</nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>烂柯游艺社，一次永不散场的欢聚</p>
      <p>联系方式：<a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      <p>© {{ site.time | date: '%Y' }} 烂柯游艺社</p>
    </div>
  </footer>
</body>
</html>
