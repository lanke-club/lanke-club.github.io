---
layout: base
---
{%- comment -%} A normal page: title + content (HTML or Markdown). {%- endcomment -%}
<div id="primary" class="content-area primary">
<main id="main" class="site-main">
<article class="page type-page status-publish ast-article-single" itemtype="https://schema.org/CreativeWork" itemscope="itemscope">
<header class="entry-header ast-no-thumbnail ast-no-meta">
<h1 class="entry-title" itemprop="headline">{{ page.title }}</h1>	</header><!-- .entry-header -->
<div class="entry-content clear" itemprop="text">{{ content }}</div><!-- .entry-content .clear -->
</article><!-- #post-## -->
</main><!-- #main -->
</div><!-- #primary -->
