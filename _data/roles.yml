狼子:
  anchor: wolf-son
  icon: /assets/img/roles/狼子.png
  quote: 这一切……都是谎言……
  rules_html: |-
    <p><span style="color: #000000;"><strong>狼子 · 狼</strong></span><br><font color="#000000">【觉悟】游戏开始时，你不会得知自己的身份，并随机获得一张除教父以外的神属性角色 身份牌，然后你先按此身份牌参与一切游戏进程。在以下时机你会得知自己的狼子身份： <br>（1） 狼父死亡的下一个夜间，狼父的行动环节内，上帝告知你你的狼子身份。 <br>（2）你获得猎人的身份牌，且你即将死亡时，上帝秘密告知你你的狼子身份。<br> 在你得知自己的狼子身份后，你失去先前神的技能，然后获得并可以在狼父的行动环节发动下述技能:
    <br>（1）若你先前获得预言家牌，则你获得技能【魔眼】，且上帝告知你先前你所「查验」 过的所有玩家的具体身份。 <br>（2）若你先前获得女巫牌，且你尚未使用「毒药」，则你获得技能【魔水】。
    <br>（3）若你先前获得猎人牌，则你获得技能【魔枪】。 <br>在所有其他狼人死亡后，你获得技能【狼刀】。你不可以「自爆」。若你被预言家「查验」，则无论你是否已经得知自己的狼子身份，上帝均告知预言家你为狼人。<br><br><font color="#999999">
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。<br> 【魔眼】夜间，你单独行动时，可以「查验」一名玩家，上帝告知你被「查验」玩家的具 体身份。<br> 【魔水】全局游戏限一次。你拥有一瓶「狼毒」。夜间，你单独行动时，可以「毒杀」一 名存活的玩家。 <br>【魔枪】你拥有一杆「狼枪」。除非你被「毒杀」，否则你死亡时，可以立即「枪杀」一 名存活的玩家。夜间，你单独行动时，上帝告知你当夜的「开枪状态」，若你未被「毒 杀」，则「开枪状态」为「正常」，否则为「中毒」。有你存在的局中，猎人发动【神枪】 时不可以翻开身份牌。你不可以「自爆」。</font><br></p>
    <p><font color="#000000">
    注：若一名玩家被两瓶「解药」同时「解救」，则其存活。</font><br></p>
教父:
  anchor: godfather
  icon: /assets/img/roles/教父.png
