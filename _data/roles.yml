  quote: 我宣判你有罪！
  rules: |-
    **审判官** · 神
    【神判】全局游戏限一次。夜间，你行动时，可以「召集」两名其他存活的玩家。上帝唤醒被「召集」的玩家，然后你和这些玩家可以交流信息，并共同决定「击杀」一名存活的玩家。若你们对「击杀」对象无法达成一致，则当夜无人被「击杀」。
帝尊魔皇:
  anchor: monster-king
  icon: /assets/img/roles/帝尊魔皇.png
  quote: 毁灭吧。
  rules_html: |-
    <p><font color="#000000"><b>帝尊魔皇</b></font><span style="color: #000000;"> · 狼</span><br/><font color="#000000">【魔尊】你不可以「自爆」。夜间，你单独行动时，上帝告知你其他存活的狼人号码。其他狼人全部死亡后，你获得技能【狼刀】。<br/>【乾坤】夜间，你行动时，可以「保佑」一名存活的玩家，令其立即进入「纯阳」或「至阴」状态。你不可以连续两夜「保佑」同一名玩家，也不可以连续两夜令被「保佑」的玩家进入同一种状态。</font><br/></p>【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    为
九天圣人:
  anchor: saint
  icon: /assets/img/roles/九天圣人.png
