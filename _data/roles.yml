    【得瑟】夜间，你第一次行动时，可以选择一个其他存活的非捉奸人玩家「偷情」。你第二次行动时，若你先前「偷情」，则上帝告知你是否「偷情」成功，若成功，则你可以「击杀」捉奸人，然后你成为捉奸人，你当夜的「偷情」对象成为偷情者。若你先前没有「偷情」，则上帝告知你捉奸人是否「防范」，若捉奸人「防范」，则其下一个夜间其可以选择的「防范」对象数量减一。
捉奸人:
  anchor: cheat-catcher
  icon: /assets/img/roles/捉奸人.png
  quote: 你们给我等着！
  rules: |-
    **捉奸人**
    【情侣】夜间，你第一次行动时，上帝告知你偷情者的号码。你与偷情者中的一名玩家以任何形式死亡，则另一名玩家立即「殉情」死亡，且死亡时不可以发动技能，上帝公布其「殉情而死」。
    【翻篇】夜间，你第一次行动时，可以选择若干名其他存活的玩家作为「防范」对象，数量为夜间开始时存活玩家数量的一半，向下取整。若你「防范」，则若当夜偷情者与「防范」对象「偷情」，其「偷情」失败，否则其「偷情」成功。你第二次行动时，上帝告知你偷情者是否「偷情」，若其「偷情」，上帝告知你其是否「偷情」成功，若其「偷情」失败，则你可以在以下两项中选择至多一项：
    （1）「击杀」偷情者，并选择一名其他存活的玩家令其立即成为偷情者；
    （2）令偷情者下一个夜间不可以「偷情」。

    注1：被捉奸人或偷情者「击杀」的玩家死亡时不可以发动技能，且失去第三方阵营，回归原有阵营。
    注2：在同一对捉奸人和偷情者之间，「防范」对象数量减一的效果持续有效且可以累加。
