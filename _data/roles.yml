    【霸体】你拥有一条额外的生命。若你被预言家「查验」，则上帝告知预言家你为狼人。
    【嗜血】在偶数夜，你单独行动时，可以「刀杀」一名存活的玩家。

    注：异形可以始终不与狼人达成一致，使狼人无法「刀杀」任何玩家。
开膛手杰克:
  anchor: jack
  icon: /assets/img/roles/开膛手杰克.png
  quote: 都去死吧，都去死吧！
  rules: |-
