    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【魔舌】夜间，你单独行动时，上帝告知你当夜被「刀杀」玩家的具体身份。
流浪汉:
  anchor: stray
  icon: /assets/img/roles/流浪汉.png
  quote: 光脚的不怕穿鞋的！
  rules: |-
    **流浪汉 · 神**
    【无畏】你死亡时，可以翻开此身份牌，然后选择一名存活的玩家，令上帝翻开其身份牌。 若该玩家是狼人，则其不可以「自爆」。

    注：因【无畏】而被翻牌的猎人在翻牌时不可以发动【神枪】，但其死亡后可以正常发动 【神枪】。
幻术师:
  anchor: illusionist
  icon: /assets/img/roles/幻术师.png
  quote: 莫把湖面倒影，当做夜空繁星。
  rules_html: |-
    <p><font color="#000000"><b>幻术师 · 狼</b></font><br><font color="#000000">【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。</font><br><font color="#000000">【首领】你不可以成为「刀杀」对象，也不可以「自爆」。</font><br><font color="#000000">【幻术】夜间，你单独行动时，可以「操纵」一名其他存活的玩家成为「傀儡」。「傀儡」 在夜间不会以任何形式死亡。下一个白天的放逐投票环节，若「傀儡」获得至少一票，则 当天「傀儡」被放逐。若「傀儡」在白天以任何形式死亡，则你永久失去「操纵」能力。 若你死亡，则「操纵」效果立即失效。你不可以连续两夜「操纵」同一名玩家。
    <br><br>
    注：上帝宣布放逐投票结果后，若「傀儡」获得至少一票，则上帝公布该玩家为「傀儡」
    并由于技能原因即将被放逐，而获最多票的玩家不会被放逐。若无玩家投票给「傀儡」，
    则上帝不会公布「傀儡」玩家。若「傀儡」原本即得最多票，则上帝仍会公布该名玩家为
    「傀儡」，且幻术师仍会失去技能【幻术】。
AI狼:
  anchor: ai-wolf
  icon: /assets/img/roles/AI狼.png
  quote: 抓羊太累我不配。
  rules_html: |-
    <p><font color="#000000"><b>AI狼 · 狼</b></font><br><font color="#000000">【图灵】游戏开始时，你和科学家「绑定」。在下述时机「绑定」会解除:<br> （1）科学家发动【宿命】技能选择解除「绑定」。<br> （2）其他狼人全部死亡后，「绑定」自动解除。 「绑定」解除前，若你被预言家「查验」，则上帝告知预言家你为好人。「绑定」解除后， 你立即获得技能【狼刀】，若你被预言家「查验」，则上帝告知预言家你为狼人。你不可以「自爆」。</font><br><font color="#000000">【智能】夜间，你单独行动时，若「绑定」未解除，则你可以「搜索」至多三名玩家。若 被「搜索」的玩家中有科学家，则上帝告知你「搜索」成功，然后你立即获得技能【双刀】 并永久失去「搜索」能力。

    <br><br><font color="#999999">
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。<br>
    【双刀】全局游戏限一次。夜间，你单独行动时，可以「刀杀」一名存活的玩家。女巫无
    法得知你发动此技能时选择的「刀杀」对象。

    <br><br><font color="#000000">
    注：科学家不会得知自己是否被 AI 狼「搜索」成功。
科学家:
  anchor: scientist
  icon: /assets/img/roles/科学家.png
  quote: 狼来了还是AI来了？
  rules: |-
    **科学家 · 神**
    【研发】夜间，你单独行动时，可以「分析」至多三名玩家。若被「分析」的玩家中有 AI 狼，则上帝告知你「分析」成功，然后你立即获得一条额外的生命并永久失去「分析」 能力。
    【宿命】游戏开始时，你和 AI 狼「绑定」。夜间，你单独行动时，若你已失去「分析」 能力，则你可以解除「绑定」。「绑定」解除前，若你以任何形式死亡，则 AI 狼立即死亡。

    注：AI狼不会得知自己是否被科学家「分析」成功。
虎:
  anchor: tiger
  quote: 爱你孤身走暗巷
  rules_html: |-
    <p><font color="#000000"><b>虎 · 狼</b></font><br><font color="#000000">【兽王】夜间，你可以「重伤」一名存活的玩家，或者猎杀任意数量被你「重伤」过的玩家。如果你「重伤」狼人，那名狼人得知你的号码，如果你被狼人刀杀，你得知参与刀杀你的狼人的号码，并且可以选择其中一名狼人成为今晚被刀杀的对象。 </font><br><font color="#000000">【独行】你不能自爆，不与狼人一起睁眼行动，所有狼人死亡之后你获得技能【狼刀】。(被「重伤」的玩家夜间会被告知自己被「重伤」，虎不能在同一晚使用【兽王】和【狼刀】。)

    </p></span></p><font color="#000000"><p><font color="#999999">【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。<br></font></p></font>
龙:
  anchor: dragon
  quote: 凡人，说出你的愿望
  rules_html: <p><font color="#000000"><b>龙 · 神</b></font><br><font color="#000000">【神龙】在白天的发言阶段，任意在场玩家可以公开向神龙发起许愿，复活或击杀不超过当时天数 对应数量的玩家，发起许愿的玩家可以指定存活的邻座玩家参与许愿，共同许愿玩家的数量必须等 于被复活或击杀的玩家数量，发起许愿后上帝倒数十秒，若无人回应，发起许愿的玩家立即死亡；若龙回应了他的愿望，且共同许愿的玩家底牌均为好人牌，愿望立即被实现（全局游戏限一次）， 若许愿的玩家中有狼人牌，龙失去技能。龙不能发起许愿，也不能回应指定了自己参与的许愿。 （许愿时可以选择部分复活部分击杀，比如在第三天可以许愿复活两名玩家击杀一名玩家。）</font><br><font color="#000000">
变脸师:
  anchor: cheater
  icon: /assets/img/roles/变脸师.png
  quote: 川剧变脸。
  rules: |-
    **变脸师 · 第三方**
    【易容】夜间，你必须选择一名其他存活玩家，与他交换身份、属性与技能，被交换者（新的变脸师）获得第三方身份、属性、技能与阵营，立即生效。次夜入夜前，你仍属于第三方阵营，若被换者（新的变脸师）死亡，则你殉情死亡。次夜入夜后，你获得交换后的阵营。你被预言家查验时为好人。
