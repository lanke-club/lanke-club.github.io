# Every role in 烂柯游艺社角色全册, by name. See README → "角色全册".
#   anchor: the #id used in links;  icon: 128px image;  quote, rules: lk-text

普通狼人:
  anchor: werewolf
  icon: /wp-content/uploads/2021/03/狼人.png
  quote: 嗷呜……
  rules: |-
    **普通狼人** · 狼
    【狼刀】夜间,你和其他存活的狼人行动时,可以「刀杀」一名存活的玩家。
    【现形】白天发言环节，若你不是最后一狼，则你可以翻开此身份牌「自爆」。若如此做，则你立即死亡，上帝必须终止当前的发言，并立即进入夜间。当夜，狼人行动时，你仍然可以参与，行动结束后立即离开游戏现场。

    注 1: 狼人「自爆」后的效果参见《法典》第三十七条和第四十四条。
    注 2: 普通狼人后文简称为普狼。
预言家:
  anchor: seer
  icon: /wp-content/uploads/2021/03/预言家.png
  quote: 神啊，请赐予我力量吧！
  rules: |-
    **预言家** · 神
    【神谕】夜间，你行动时，可以「查验」一名玩家，上帝告知你被「查验」的玩家是否为狼人。
女巫:
  anchor: witch
  icon: /wp-content/uploads/2021/03/女巫.png
  quote: 你的生死由我掌控。
  rules: |-
    **女巫** · 神
    【神水】夜间，你行动时，上帝告知你当夜狼人的「刀杀」对象。全局游戏限一次，你拥有一瓶「解药」，可以「解救」一名被狼人「刀杀」的其他玩家，然后被「解救」的玩家不会因此次「刀杀」而死亡。「解药」使用后，上帝不再告知你狼人的「刀杀」对象。全局游戏限一次,你拥有一瓶「毒药」，可以「毒杀」一名存活的玩家。你不可以在同一个夜间既使用「解药」又使用「毒药」。

    注 1: 女巫始终不可以对自己使用「解药」。
    注 2: 某些版型中，可能出现一名玩家同一个夜间被「刀杀」两次的情况,则即使女巫对其使用「解药」,该玩家依然死亡。
猎人:
  anchor: hunter
  icon: /wp-content/uploads/2021/03/猎人-150x150.png
  quote: 枪在手，跟我走！
  rules: |-
    **猎人** · 神
    【神枪】你拥有一杆「猎枪」。除非你被「毒杀」，否则你死亡时，你可以翻开此身份牌，然后立即「枪杀」一名存活的玩家。夜间，你行动时，上帝告知你当夜的「开枪状态」，若你未被「毒杀」，则「开枪状态」为「正常」，否则为「中毒」。

    注 1: 猎人在白天死亡时「枪杀」的玩家视为在白天死亡，在夜间死亡时「枪杀」的玩家视为在夜间死亡。
    注 2: 某些版型中，猎人可能会有除「正常」和「中毒」以外的「开枪状态」。若猎人的「开枪状态」不是「正常」，则其死亡时不可以发动【神枪】。
    注 3: 注 1 与注 2 适用于其他拥有【神枪】技能的角色。

    \
白痴:
  anchor: moron
  icon: /wp-content/uploads/2021/03/白痴.png
  quote: 刚才发生了什么？
  rules: |-
    **白痴** · 神
    【神识】若你被放逐,则你必须翻开此身份牌，然后你死亡，可以发表遗言。之后，你可以继续存留在游戏现场正常参与游戏进程，但不可以投票，也不可以成为警长。
守卫:
  anchor: guard
  icon: /wp-content/uploads/2021/03/守卫.png
  quote: 你不可以通过！
  rules: |-
    **守卫** · 神
    【神盾】夜间，你行动时，可以「守护」一名存活的玩家。若被「守护」的玩家当夜成为「刀杀」对象，则其不会因此次「刀杀」而死亡。但是，若被「守护」的玩家当夜同时被女巫「解救」，则该玩家依然死亡。你不可以连续两夜「守护」同一名玩家。

    注: 某些版型中，可能出现一名玩家同一个夜间被「刀杀」两次的情况，则即使其被守卫「守护」，该玩家依然死亡。但是，这种情况下，若该玩家同时被女巫「解救」，则该玩家不会因这两次「刀杀」而死亡。
普通村民:
  anchor: villager
  icon: /wp-content/uploads/2021/03/平民.png
  quote: 又是忙碌的一天啊……
  rules: |-
    **普通村民** · 民

    注 1:普通村民没有任何技能。
    注 2:普通村民后文简称为村民。
混血儿:
  anchor: mixblood
  icon: /assets/img/roles/混血儿.png
  quote: 爸爸去哪儿了？
  rules: |-
    **混血儿** · 民
    【认父】全局游戏限一次。第一夜，你行动时，必须选择一名其他玩家作为「血亲」。若「血亲」为好人，则本局游戏你属于好人阵营，否则你属于狼人阵营。若你被预言家「查验」，则上帝告知预言家你为好人。

    注：混血儿不会得知其「血亲」的阵营。
九尾妖狐:
  anchor: nine-tails
  icon: /assets/img/roles/九尾妖狐.png
  quote: 你喜欢我的尾巴吗？
  rules: |-
    **九尾妖狐** · 神
    【幻尾】游戏开始时，你拥有九条「尾巴」。每有一名神死亡，你失去两条「尾巴」。每有一名村民死亡，你失去一条「尾巴」。若你失去所有「尾巴」，则你死亡。夜间，你行动时，上帝告知你此时拥有的「尾巴」数，此数计入当夜即将死亡的玩家。
白狼王:
  anchor: white-wolf-king
  icon: /assets/img/roles/白狼王.png
  quote: 我的皮是白的，我的心不是。
  rules: |-
    **白狼王** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【现形】发言环节、警上发言环节或第二天警长竞选的退选环节内，若你不是最后一狼，则你可以翻开此身份牌「自爆」。
    【狂怒】你「自爆」时可以立即「击杀」一名存活的玩家。

    注: 狼人「自爆」后的效果参见《法典》第三十七条和第四十四条。
骑士:
  anchor: knight
  icon: /assets/img/roles/骑士.png
  quote: 看招！
  rules: |-
    **骑士** · 神
    【神剑】全局游戏限一次。在狼人可以「自爆」的时机，你可以翻开此身份牌。若如此做，则当前的环节暂停，你必须立即选择一名其他存活的玩家与其「决斗」。若被「决斗」的玩家为狼人，则该玩家立即死亡，然后上帝按有狼人「自爆」的情况执行之后的环节。若被「决斗」的玩家为好人，则你立即死亡，然后先前被暂停的环节继续正常进行。

    注: 狼人「自爆」后的效果参见《法典》第三十七条和第四十四条。
黑狼王:
  anchor: black-wolf-king
  icon: /assets/img/roles/黑狼王.png
  quote: 我的皮是黑的，我的心更是。
  rules: |-
    **黑狼王** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【魔枪】你拥有一杆「狼枪」。除非你被「毒杀」，否则你死亡时，你可以立即「枪杀」一名存活的玩家。夜间，你单独行动时，上帝告知你当夜的「开枪状态」，若你未被「毒杀」，则「开枪状态」为「正常」，否则为「中毒」。有你存在的局中，猎人发动【神枪】时不可以翻开身份牌。你不可以「自爆」。

    注 1: 黑狼王在白天死亡时「枪杀」的玩家视为在白天死亡，在夜间死亡时「枪杀」的玩家视为在夜间死亡。
    注 2: 某些版型中，黑狼王可能会有除「正常」和「中毒」以外的「开枪状态」。若黑狼王的「开枪状态」不是「正常」，则其死亡时不可以发动【魔枪】。
    注 3: 注 1 与注 2 适用于其他拥有【魔枪】技能的角色。
魔术师:
  anchor: magician
  icon: /assets/img/roles/魔术师.png
  quote: 下面是见证奇迹的时刻！
  rules: |-
    **魔术师** · 神
    【移形】夜间，你行动时，可以「交换」两名存活玩家的号码。当夜，若其中一名玩家成为狼或其他神发动技能的对象，则技能效果将实际施加于另一名玩家。你不可以「交换」先前已被「交换」过的号码。

    注1：上帝告知女巫狼人的「刀杀」对象时,此号码不受「交换」效果影响。
    注2：猎人或黑狼王选择「枪杀」对象时，始终不可以选择自己的号码。
    \
摄梦人:
  anchor: dream-controller
  icon: /assets/img/roles/摄梦人.png
  quote: 接受我的操控吧。
  rules: |-
    **摄梦人** · 神
    【织梦】夜间,你行动时,必须令一名其他存活的玩家进入「梦游」状态。当夜,其他角色的致死技能对处于「梦游」状态的玩家无效。若你于当夜死亡,则处于「梦游」状态的玩家死亡。若你连续两夜令同一名玩家进入「梦游」状态,则该玩家死亡。处于「梦游」状态的玩家死亡时不可以发动技能。白天开始后,处于「梦游」状态的玩家立即复原。

    注1：女巫对「梦游」者使用「解药」，「梦游」者存活。
    注2：若处于「梦游」状态的猎人或黑狼王即将死亡，则上帝在其行动时告知其「开枪状态」为「异常」。
恶魔:
  anchor: demon
  icon: /assets/img/roles/恶魔.png
  quote: 当你凝视深渊，深渊也在凝视你。
  rules: |-
    **恶魔** · 狼
    【狼刀】夜间,你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【魔谕】夜间，你单独行动时，可以「查验」一名玩家，上帝告知你被「查验」的玩家是否为神。
    【不朽】夜间，你不会以任何形式死亡。
黑蝙蝠:
  anchor: black-bat
  icon: /assets/img/roles/蝙蝠.png
  quote: 陌生人，你可需要我的庇护？
  rules: |-
    **黑蝙蝠** · 狼
    【狼刀】夜间,你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【遮蔽】夜间，你单独行动时，可以「庇护」一名存活的玩家。若被「庇护」的玩家当夜成为守卫「守护」、女巫「毒杀」或猎人「枪杀」的对象，则同时触发以下两项效果:
    (1) 该神发动的技能无效。
    (2) 该神死亡。
    若以上两项效果触发至少一项，则你永久失去「庇护」能力。你不可以连续两夜「庇护」同一名玩家。

    注: 若同一个夜间有多名神对被「庇护」的玩家发动技能，则按这些神的行动顺序，先发动技能的神触发「庇护」效果，然后黑蝙蝠永久失去「庇护」能力，后发动技能的神不再受「庇护」效果影响。
恶灵骑士:
  anchor: devil-knight
  icon: /assets/img/roles/恶灵骑士.png
  quote: 挡我者死！
  rules: |-
    **恶灵骑士** · 狼
    【狼刀】夜间,你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【反噬】夜间，若你成为一名神发动技能的对象，则该神在其技能生效后死亡。
    \
狼美人:
  anchor: wolf-beauty
  icon: /assets/img/roles/狼美人(1).png
  quote: 你看我美吗？
  rules: |-
    **狼美人** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【魔色】夜间，你单独行动时，可以「魅惑」一名其他存活的玩家。你死亡时，被「魅惑」的玩家立即「殉情」死亡，且死亡时不可以发动技能，上帝公布其「殉情而死」。你不可以连续两夜「魅惑」同一名玩家。
    \
潜行者:
  anchor: stalker
  icon: /assets/img/roles/潜行者.png
  quote: 你必须死。
  rules: |-
    **潜行者** · 神
    【背刺】全局游戏限一次。若放逐投票时你的投票对象没有被放逐，则下一个夜间，你行动时，可以「击杀」该玩家。

    注: 若出现平票对决，则潜行者可以「击杀」的对象仅限于其在对决投票中的投票对象。
禁言长老:
  anchor: silencer
  icon: /assets/img/roles/禁言长老.png
  quote: 嘘……
  rules: |-
    **禁言长老** · 神
    【噤声】夜间，你行动时，可以「禁言」一名存活的玩家。警长竞选前和白天死亡信息公布后，上帝公布被「禁言」的玩家号码。被「禁言」的玩家除遗言以外发言不可以发出任何声音，只能使用肢体语言。若你于某一夜死亡，则你当夜的「禁言」效果立即失效。你死亡后，上帝始终公布没有任何玩家被「禁言」。你不可以连续两夜「禁言」同一名玩家。
石像鬼:
  anchor: gargoyle
  icon: /assets/img/roles/石像鬼.png
  quote: 谁在召唤我？
  rules: |-
    **石像鬼** · 狼
    【觉醒】你不可以「自爆」。其他狼人全部死亡后，你获得技能【狼刀】。
    【魔眼】夜间，你单独行动时，可以「查验」一名玩家，上帝告知你被「查验」玩家的具体身份。

    ~ 【狼刀】夜间，你和其他存活的狼人一起睁眼，可以「刀杀」一名存活的玩家。
守墓人:
  anchor: grave-keeper
  icon: /assets/img/roles/守墓人.png
  quote: 安息吧。
  rules: |-
    **守墓人** · 神
    【盖棺】夜间，你行动时，上帝告知你上一个白天被放逐的玩家是否为狼人。
机械狼:
  anchor: wolfbot
  icon: /assets/img/roles/机械狼.png
  quote: 系统已激活，正在初始化……
  rules: |-
    **机械狼** · 狼
    【觉醒】夜间，狼人行动时，你不与其他存活的狼人一起睁眼。其他狼人全部死亡后，你获得技能【猎杀】。
    【魔仿】全局游戏限一次。夜间，你单独行动时，可以选择一名其他存活的玩家「学习」其技能:
    (1)若该玩家是村民，则你不获得任何技能。
    (2)若该玩家是通灵师，则你获得技能【魔眼】。
    (3)若该玩家是女巫，则你获得技能【魔水】。
    (4)若该玩家是猎人，则你获得技能【魔枪】。
    (5)若该玩家是守卫，则你获得技能【魔盾】。
    (6)若该玩家是普狼，则你发动【觉醒】后获得技能【双刀】。
    所获得的技能不可以立即发动，于下一个白天开始后生效。有你存在的局中，猎人发动【神枪】时不可以翻开身份牌。
    【拟态】当你被通灵师「查验」时，若你已发动技能【魔仿】，则「查验」结果始终为你所「学习」的玩家的身份信息，否则「查验」结果为机械狼。

    ~ 【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    ~ 【魔眼】夜间，你单独行动时，可以「查验」一名玩家，上帝告知你被「查验」玩家的具体身份。
    ~ 【魔水】全局游戏限一次。你拥有一瓶「狼毒」。夜间，你单独行动时，可以「毒杀」一名存活的玩家。
    ~ 【魔枪】你拥有一杆「狼枪」。除非你被「毒杀」，否则你死亡时，可以立即「枪杀」一名存活的玩家。夜间，你单独行动时，上帝告知你当夜的「开枪状态」，若你未被「毒杀」，则「开枪状态」为「正常」，否则为「中毒」。有你存在的局中，猎人发动【神枪】时不可以翻开身份牌。你不可以「自爆」。
    ~ 【魔盾】夜间，你单独行动时，可以「守护」一名存活的玩家。当夜，女巫的「毒药」和猎人的「猎枪」对被「守护」的玩家无效。你不可以连续两夜「守护」同一名玩家。
    ~ 【双刀】全局游戏限一次。夜间，你单独行动时，可以「刀杀」一名存活的玩家。女巫无法得知你发动此技能时选择的「刀杀」对象。
通灵师:
  anchor: psychic
  icon: /assets/img/roles/通灵师.png
  quote: 现出你的真身吧！
  rules: |-
    **通灵师** · 神
    【神眼】夜间，你行动时，可以「查验」一名玩家的身份。上帝告知你被「查验」玩家的具体身份。
狐狸:
  anchor: fox
  icon: /assets/img/roles/狐狸.png
  quote: 我觉得你们都不是好人！
  rules: |-
    **狐狸** · 神
    【狐疑】夜间，你行动时，可以「查验」一名存活的玩家。上帝告知你被「查验」的玩家和此时该玩家左右邻位的存活玩家中是否有狼人。若有，则上帝告知你「有狼人」，否则上帝告知你「无狼人」。若上帝告知你「无狼人」，则你永久失去「查验」能力。
熊:
  anchor: bear
  icon: /assets/img/roles/熊.png
  quote: 吼！！
  rules: |-
    **熊** · 神
    【怒吼】警长竞选前和白天死亡信息公布前，上帝公布你的「咆哮状态」：
    （1）若上一个夜间开始时你存活，且当时你左右邻位的存活玩家中有狼人，则上帝公布「熊咆哮了」。
    （2）若上一个夜间开始时你存活，且当时你左右邻位的存活玩家中没有狼人，则上帝公布「熊没有咆哮」。
    （3）若你已于上一个夜间开始前死亡，则上帝公布「熊没有咆哮」。
先知:
  anchor: prophet
  icon: /assets/img/roles/先知.png
  quote: 什么都逃不过我的眼睛。
  rules: |-
    **先知** · 神
    【神旨】夜间，你行动时，可以「查验」两名存活的玩家。若被「查验」的两名玩家身份阵营相同，则上帝告知你「同阵营」，否则上帝告知你「异阵营」。第一夜，你不可以成为「查验」对象。
野孩子:
  anchor: rogue
  icon: /assets/img/roles/野孩子.png
  quote: 我是谁？
  rules: |-
    **野孩子** · 民
    【恩怨】游戏开始时，你属于好人阵营。全局游戏限一次，第一夜，你行动时，必须选择一名其他玩家作为「榜样」。若你的「榜样」于白天死亡，则下一个夜间开始时，你转变为一名普狼，然后你行动时将此身份牌返还上帝，并获得一张普狼牌。若你的「榜样」于夜间死亡，则本局游戏你始终属于好人阵营。
老流氓:
  anchor: satyr
  icon: /assets/img/roles/老流氓.png
  quote: 爽！
  rules: |-
    **老流氓** · 民
    【套路】当狼美人死亡时，若其「魅惑」对象是你，则此次「魅惑」无效，你不会「殉情」死亡，上帝不会公布此次「魅惑」信息。
    【苟延】若你于夜间因任何致死技能而即将死亡，则此次技能无效，然后你进入「负伤」状态。白天放逐投票结束后，若你处于「负伤」状态，则你立即死亡，可以发表遗言。

    注：老流氓不会得知自己进入「负伤」状态。
隐狼:
  anchor: mystic-wolf
  icon: /assets/img/roles/隐狼.png
  quote: 你看不见我。
  rules: |-
    **隐狼** · 狼
    【觉醒】你不可以「自爆」。其他狼人全部死亡后，你获得技能【狼刀】。
    【魔隐】若你被预言家「查验」，则上帝告知预言家你为好人。夜间，你单独行动时，上帝告知你其他存活的狼人号码。

    ~ 【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
乌鸦:
  anchor: crow
  icon: /assets/img/roles/乌鸦.png
  quote: 呱，呱，呱……
  rules: |-
    **乌鸦** · 神
    【神兆】夜间，你行动时，可以「诅咒」一名存活的玩家。被「诅咒」的玩家于下一个白天放逐投票时所获得的票数始终加一票。白天放逐投票前，上帝公布当天被「诅咒」的玩家号码。若你于某一夜死亡，则你当夜的「诅咒」效果在下一个白天放逐投票时依然有效。若某一天放逐投票前，你已于上一个夜间开始前死亡，则上帝公布没有任何玩家被「诅咒」。你不可以连续两夜「诅咒」同一名玩家。

    注：乌鸦的「诅咒」在对决投票中依然有效。
种狼:
  anchor: stud-wolf
  icon: /assets/img/roles/种狼.png
  quote: 不然你们以为狼人都是石头缝里蹦出来的么？
  rules: |-
    **种狼** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【变异】全局游戏限一次。夜间，你单独行动时，可以「感染」当夜被「刀杀」的玩家。被「感染」的玩家当夜不会因先前的「刀杀」而死亡，且其立即失去所有技能，并转变为一名普狼。但是，若被「感染」的玩家当夜被女巫「解救」或被守卫「守护」，则「感染」失败。你行动后，上帝唤醒被成功「感染」的玩家，告知其被「感染」，然后该玩家返还原先的身份牌，并获得一张普狼牌。
    【迷雾】有你存在的局中，隐狼失去技能【觉醒】，且无法得知其他存活的狼人号码。

    注：若被「感染」的玩家当夜同时被女巫「解救」和被守卫「守护」，则「感染」成功。
狼外婆:
  anchor: wolf-grandma
  icon: /assets/img/roles/狼外婆.png
  quote: 你好，小红帽。
  rules_html: '<p><span style="color: #000000;"><strong>狼外婆</strong> · 狼</span><br/><span style="color: #000000;">【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。<br/>【首领】你不可以成为「刀杀」对象，也不可以「自爆」。<br/>【幻身】夜间，你单独行动时，可以「伪装」一名存活的玩家。当预言家「查验」被「伪装」的玩家时，上帝告知预言家与其真实阵营相反的结果。若你存活，则「伪装」效果持续有效。你死亡时，所有「伪装」效果立即失效。<br/>【遗训】你死亡时，所有存活的狼人立即获得技能【不朽】。</span></p>【不朽】夜间，你不会以任何形式死亡。'
小红帽:
  anchor: redhat
  icon: /assets/img/roles/小红帽.png
  quote: 你好，狼先生。
  rules: |-
    **小红帽** · 神
    【险象】你拥有一条额外的生命。夜间，你行动时，若你已经或即将失去至少一条生命，则上帝告知你大狼的号码。
天狗:
  anchor: tiangou
  icon: /assets/img/roles/天狗.png
  quote: 好饿。
  rules: |-
    **天狗** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【吞月】夜间，你单独行动时，可以「吞噬」一名其他存活的玩家。若被「吞噬」的玩家于下一个白天被放逐，则此次放逐无效，形成平安日。若你于某一夜死亡，则你当夜的「吞噬」效果立即失效。你不可以连续两夜「吞噬」同一名玩家。
    【长夜】你死亡后的下一个夜间，所有神不可以发动技能，上帝在这些神行动时告知其「长夜来临」。

    注：即使一名神已经没有技能可以发动，【长夜】发动后，上帝依然告知其「长夜来临」。
月女:
  anchor: moon-girl
  icon: /assets/img/roles/操控月亮的女孩.png
  quote: 亲爱的，我们明天再见面吧。
  rules: |-
    **月女** · 神
    【极昼】全局游戏限一次。夜间，你行动时，可以令上帝跳过此次夜间之后所有的环节，直接进入下一个白天。
狐仙:
  anchor: huxian
  icon: /assets/img/roles/狐仙.png
  quote: 春宵苦短日高起，从此君王不早朝。
  rules: |-
    **狐仙** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【噬魂】夜间，你单独行动时，可以「引诱」一名存活的玩家。下一个白天放逐投票时，若有玩家投票给被「引诱」的玩家，则下一个夜间你单独行动时，可以在这些投票的玩家中选择一名令其死亡，且死亡时不可以发动技能，然后你永久失去「引诱」能力。你不可以连续两夜「引诱」同一名玩家。

    注：若猎人因【噬魂】而即将死亡，则上帝在其行动时告知其「开枪状态」为「异常」。
阴阳使者:
  anchor: yin-yang-master
  icon: /assets/img/roles/阴阳使者.png
  quote: 临邛道士鸿都客，能以精诚致魂魄。
  rules: |-
    **阴阳使者** · 神
    【神丹】全局游戏限一次。从第二夜开始，夜间，你行动时，可以「复活」一名已死亡的玩家。夜间结束时，被「复活」的玩家从第二现场返回游戏现场，继承先前的阵营、属性、技能和状态，然后正常参与一切游戏进程。

    注：若被「复活」的玩家已发动过其身份牌上标有「全局游戏限一次」的技能，则其「复活」后不可以再次发动此技能。
邪恶商人:
  anchor: devil-merchant
  icon: /assets/img/roles/邪恶商人.png
  quote: 只有想不到，没有买不到。
  rules: |-
    **邪恶商人** · 狼
    【猎杀】夜间，你和其他存活的狼人一起睁眼，可以「刀杀」一名存活的玩家。
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【魔契】夜间，你单独行动时，可以将一杆「狼枪」「交易」给一名存活的普狼，该普狼获得技能【魔枪】，于下一个白天开始后生效。之后，若白天有其他的普狼死亡，则下一个夜间你单独行动时，可以回收「狼枪」，并将一瓶「毒药」「交易」给另一名存活的普狼，该普狼获得技能【魔水】，于下一个夜间开始时生效，然后先前的普狼立即失去技能【魔枪】。若【魔枪】和【魔水】有一个技能被发动，则你永久失去「交易」能力。你行动后，上帝分别唤醒获得技能和失去技能的狼人，告知其所获得或失去的技能，拥有【魔枪】的普狼之后在此行动环节睁眼得知自己的「开枪状态」，拥有【魔水】的狼人之后在此行动环节选择发动技能。有你存在的局中，猎人发动【神枪】时不可以翻开身份牌。

    ~ 【魔水】全局游戏限一次。你拥有一瓶「狼毒」。夜间，你单独行动时，可以「毒杀」一名存活的玩家。
    ~ 【魔枪】你拥有一杆「狼枪」。除非你被「毒杀」，否则你死亡时，可以立即「枪杀」一名存活的玩家。夜间，你单独行动时，上帝告知你当夜的「开枪状态」，若你未被「毒杀」，则「开枪状态」为「正常」，否则为「中毒」。有你存在的局中，猎人发动【神枪】时不可以翻开身份牌。你不可以「自爆」。
魔狼:
  anchor: demon-wolf
  icon: /assets/img/roles/魔狼.png
  quote: 让你们知道我的厉害！
  rules: |-
    **魔狼** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【魔爪】全局游戏限一次。夜间，你单独行动时，可以「重创」一名存活的非狼人玩家。被「重创」的玩家立即永久失去其所有技能。若该玩家是神，则上帝在其行动时告知其被「重创」。
    【魔体】当你被放逐时，若你是最后一狼，则此次放逐无效，形成平安日，然后你于下一个夜间结束时死亡。

    注：即使一名神已经没有技能可以发动，当其被魔狼「重创」后，上帝依然在该神行动时告知其被「重创」。
猎魔人:
  anchor: demon-hunter
  icon: /assets/img/roles/猎魔人.png
  quote: 孽障，你的死期到了！
  rules: |-
    **猎魔人** · 神
    【神狩】从第二夜开始，夜间，你行动时，可以「狩猎」一名其他存活的玩家。若被「狩猎」的玩家是狼人，则该玩家死亡，否则你死亡。
    【神体】女巫的「毒药」对你无效。
血月使徒:
  anchor: blood-moon
  icon: /assets/img/roles/血月使徒.png
  quote: 这就是死亡的颜色。
  rules_html: '<p><span style="color: #000000;"><strong>血月使徒</strong> · 狼</span><br><span style="color: #000000;">【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。<br>【现形】发言环节、警上发言环节或第二天警长竞选的退选环节内，若你不是最后一狼，则你可以翻开此身份牌「自爆」。<br>【血月】你「自爆」后的下一个夜间，所有神不可以发动技能。上帝在这些神行动时告知其「血月来临」。<br>【魔体】当你被放逐时，若你是最后一狼，则此次放逐无效，形成平安日。然后你于下一个夜间结束时死亡。</font><br></p>注1：狼人「自爆」后的效果参见《法典》第三十七条和第四十四条。<br>注2：即使一名神已经没有技能可以发动，【血月】发动后，上帝依然告知其「血月来临」。'
花蝴蝶:
  anchor: butterfly
  icon: /assets/img/roles/花蝴蝶.png
  quote: 这朵花好香啊。
  rules_html: |-
    <p><span style="color: #000000;"><strong>花蝴蝶</strong> · 神</span><br/><font color="#000000">【神茧】夜间，你行动时，可以「拥抱」一名存活的玩家。若被「拥抱」的玩家是神，则上帝在其行动时告知其被「拥抱」，然后该神当夜不可以发动技能。若被「拥抱」的玩家是狼人，则上帝在狼人行动时告知所有狼人被「拥抱」的狼人号码，然后狼人当夜不可以「刀杀」任何玩家。你不可以连续两夜「拥抱」同一名玩家。当你第二次「拥抱」后，你永久失去「拥抱」能力。</font><br/></p>
    <p>注：即使被「拥抱」的神已经没有技能可以发动，上帝依然告知其被「拥抱」。<br/></p>
狼兄:
  anchor: big-wolf-brother
  icon: /assets/img/roles/狼兄.png
  quote: 弟弟，一切都交给你了！
  rules: |-
    **狼兄** · 狼
    【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
狼弟:
  anchor: little-wolf-brother
  icon: /assets/img/roles/狼弟.png
  quote: 杀了我哥哥的人，你们全都得死！
  rules: |-
    **狼弟** · 狼
    【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    【复仇】狼兄死亡前，若你被预言家「查验」，则上帝告知预言家你为好人。狼兄死亡后的下一个夜间开始时，你失去技能【首领】，转变为一名普狼，并获得技能【双刀】，然后你行动时，将此身份牌返还上帝，并获得一张普狼牌。

    ~ 【双刀】全局游戏限一次。夜间，你单独行动时，可以「刀杀」一名存活的玩家。女巫无法得知你发动此技能时选择的「刀杀」对象。
black-market-merchant:
  anchor: black-market-merchant
  icon: /assets/img/roles/黑市商人.png
  quote: 票子有伐？好东西要伐？
  rules: |-
    黑市商人 · 神
    【神契】全局游戏限一次。夜间，你行动时，可以将「预言球」、「毒药」和「猎枪」中的一个道具「交易」给一名其他存活的玩家。若被「交易」的玩家是狼人，则「交易」失败且你死亡。若被「交易」的玩家是好人，则「交易」成功，该玩家成为幸运儿，并获得对应的技能：
    （1）若是「预言球」，则其获得技能【神谕】。
    （2）若是「毒药」，则其获得技能【神毒】。
    （3）若是「猎枪」，则其获得技能【神枪】。
    所获得的技能不可以立即发动，于下一个白天开始后生效。夜间，幸运儿行动时，上帝告知其所获得的技能。有你存在的局中，有玩家发动【神枪】时不可以翻开身份牌。
    【神约】当你发动【神契】时：
    （1）若你将「预言球」「交易」给预言家，则其失去技能【神谕】并获得技能【神光】。
    （2）若你将「毒药」「交易」给女巫，则其获得技能【还阳】。
    （3）若你将「猎枪」「交易」给猎人，则其获得技能【神射】。
    所获得的技能不可以立即发动，于下一个白天开始后生效。

    ~ 【神谕】夜间，你行动时，可以「查验」一名玩家，上帝告知你被「查验」的玩家是否为狼人。
    ~ 【神毒】全局游戏限一次。你拥有一瓶「毒药」。夜间，你行动时，可以「毒杀」一名存活的玩家。
    ~ 【神枪】你拥有一杆「猎枪」。除非你被「毒杀」，否则你死亡时，你可以翻开此身份牌，然后立即「枪杀」一名存活的玩家。夜间，你行动时，上帝告知你当夜的「开枪状态」，若你未被「毒杀」，则「开枪状态」为「正常」，否则为「中毒」。
    ~ 【神光】全局游戏限一次。夜间，你行动时，可以「查验」三名玩家的身份，上帝告知你每一位被「查验」的玩家是否为狼人。
    ~ 【神丹】全局游戏限一次。从第二夜开始，夜间，你行动时，可以「复活」一名已死亡的玩家。夜间结束时，被「复活」的玩家从第二现场返回游戏现场，继承先前的阵营、属性、技能和状态，然后正常参与一切游戏进程。
    ~ 【神射】当你发动【神枪】「枪杀」一名玩家后，若该玩家是狼人，则你可以再次发动【神枪】。
奇迹商人:
  anchor: miracle-merchant
  icon: /assets/img/roles/奇迹商人.png
  quote: 惊不惊喜？意不意外？
  rules: |-
    **奇迹商人** · 神
    【神契】全局游戏限一次。夜间，你行动时，可以将「预言球」、「毒药」和「盾牌」中的一个道具「交易」给一名其他存活的玩家。若被「交易」的玩家是狼人，则「交易」失败且你死亡。若被「交易」的玩家是好人，则「交易」成功，该玩家成为幸运儿，并获得对应的技能：
    （1）若是「预言球」，则其可以「查验」一名玩家，上帝告知其被「查验」的玩家是否为狼人。
    （2）若是「毒药」，则其可以「毒杀」一名存活的玩家。
    （3）若是「盾牌」，则其可以「守护」一名存活的玩家，若被「守护」的玩家当夜成为「刀杀」对象，则其不会因此次「刀杀」而死亡。
    所获得的技能当夜即可发动，但全局游戏限一次。幸运儿行动时，上帝告知其所获得的技能。

    注：若被「刀杀」的玩家同时被幸运儿「守护」和女巫「解救」，则该玩家依然死亡。但是，这种情况下，若该玩家同时被守卫「守护」，则该玩家不会因此次「刀杀」而死亡。
大灰狼:
