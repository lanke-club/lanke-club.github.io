  quote: 光明黑暗，游走其中。
  rules_html: <p><font color="#000000"><b>术士 </b>· 神<br/>【光耀】夜间，你行动时，可以「照耀」一名存活的玩家。被「照耀」的玩家当夜不会以任何形式死亡。若被「照耀」的玩家当夜成为致死技能的对象，则下一个夜间你行动时，上帝告知你失去此技能，然后你获得技能【暗言】。你不可以连续两夜「照耀」同一名玩家。<br/></font></p><p>【暗言】全局游戏限一次。你于获得此技能的夜间行动时可以「击杀」一名存活的玩家。<font color="#000000"><br/></font></p>
偷情者:
