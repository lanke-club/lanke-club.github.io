纯白之女:
  anchor: white-girl
  icon: /assets/img/roles/纯白之女.png
  quote: 看着我的眼睛。
  rules: |-
    **纯白之女** · 神
    【神目】夜间，你行动时，可以「查验」一名玩家，上帝告知你被「查验」玩家的具体身份。从第二夜开始，若被你「查验」的玩家为狼人，则该玩家死亡。
混沌之魔:
  anchor: chaos
  icon: /assets/img/roles/混沌之魔.png
  quote: 我无处不在。
  rules: |-
