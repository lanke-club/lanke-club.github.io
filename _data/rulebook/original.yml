  name: '偷情者与捉奸人<br/><span style="font-weight: normal;">烂柯游艺社第一届原创角色设计大赛 · 二等奖<br/>设计者：</span><span style="font-weight: 400;">邓默，周奕纯</span>'
  blocks:
  - text: |-
      **角色配置**：4 [普狼](#werewolf)；4 [村民](#villager)，1 [预言家](#seer)，1 [女巫](#witch)，1 [猎人](#hunter)，1 [白痴](#moron)
      **行动顺序**：捉奸人，偷情者，狼人，预言家，女巫，猎人，白痴，捉奸人，偷情者
      **第三方阵营**：偷情者，捉奸人
      **特殊说明**：[偷情者](#cheater)和[捉奸人](#cheat-catcher)均不是初始身份，不在十二张身份牌中。第一夜开始时，上帝随机指定一名玩家成为第一名捉奸人，然后由其指定另一名玩家成为第一名偷情者。
    class: lk-center lk-ink
  - role: 偷情者
  - role: 捉奸人
  - text: |-
      **胜负判定**：
      （1）在至少有一名非第三方狼存活的情况下，若所有神和第三方玩家死亡，或所有民和第三方玩家死亡，则狼人阵营获胜。
      （2）若所有存活的玩家均为好人，则好人阵营获胜。
      （3）若所有存活的玩家均为第三方，则第三方阵营获胜。
    class: lk-ink
  toc: 偷情者与捉奸人
