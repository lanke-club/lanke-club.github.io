- id: template64
  number: 64
  name: '变脸师<br/><span style="font-weight: normal;">烂柯游艺社第三届原创角色设计大赛 · 特等奖<br/></span><span style="font-weight: 400;">设计者：杨衣容</span>'
  lineup: 2大狼，2普狼；3村民，1预言家，1女巫，1猎人，1守卫；1变脸师
  order: 普狼一与大狼一，普狼二与大狼二，变脸师，大狼一（【追踪】技能），大狼二（【追踪】技能），守卫，预言家，女巫，猎人
  blocks:
  - role: 变脸师
  - text: '*坚毅的容貌无法被改变。*'
    class: lk-center
  - html: '<p><font color="#000000"><b>大狼 · 狼</b></font><br><font color="#000000">【追踪】全局游戏限一次。夜间，若同队普狼成为第三方，则上帝告知你该玩家号码，你可以「追</font><span style="color: rgb(0, 0, 0); font-style: inherit; font-weight: inherit; font-family: var( --e-global-typography-text-font-family ), Sans-serif;">踪」该目标，上帝每夜告诉你该玩家的身份。</font><br><font color="#000000">【首领】你不可以自刀，不可以「自爆」。</font><br><font color="#000000">【坚毅】每一夜入夜，你重新得知所有狼人的号码。若你成为「易容」对象，则此次「易容」失</font><span style="color: rgb(0, 0, 0); font-style: inherit; font-weight: inherit; font-family: var( --e-global-typography-text-font-family ), Sans-serif;">效。</span><br><font color="#000000">【狼刀】夜间，你和同队存活的普狼行动时,可以「刀杀」一名存活的玩家。奇数夜“狼队一”刀杀，</font><span style="color: rgb(0, 0, 0); font-style: inherit; font-weight: inherit; font-family: var( --e-global-typography-text-font-family ), Sans-serif;">偶数夜“狼队二”刀杀。每一夜，上帝告诉两个狼队具体的刀口。若一队普狼死亡，则由同一队的大</span><span style="color: rgb(0, 0, 0); font-style: inherit; font-weight: inherit; font-family: var( --e-global-typography-text-font-family
      ), Sans-serif;">狼刀杀。若同一队两只狼人都死亡，则无论奇偶夜，由另一队进行刀杀。若另一队仅存的普狼死</span><span style="color: rgb(0, 0, 0); font-style: inherit; font-weight: inherit; font-family: var( --e-global-typography-text-font-family ), Sans-serif;">亡，则由最后一只大狼刀杀。</span></p>'
  - text: |-
      胜负判定：
      （1）当所有神或所有民死亡时，若第三方存活，则第三方阵营获胜，否则狼人阵营获胜。
      （2）当所有狼死亡时，若第三方存活，则第三方阵营获胜，否则好人阵营获胜。

      注：
      （1）”全局游戏限一次的技能”的技能只能发动一次。如女巫使用毒药后，下一个获得女巫身份的玩家便不能使用毒药。女巫于获得身份时得知拥有的解药、毒药信息。守卫于获得身份时得知前一夜守护信息。
      （2）【坚毅】不会得知狼人的身份。【坚毅】技能触发后，上帝告知变脸师【易容】失效。
    class: lk-ink
  toc: 变脸师
- id: template65
  number: 65
  name: '猫<br/><span style="font-weight: normal;">烂柯游艺社第三届原创角色设计大赛 · 一等奖<br/></span><span style="font-weight: 400;">设计者：陈沧皓</span>'
  blocks:
  - anchor: cheater
  - text: |-
      **角色配置**：4普狼；1猫；3村⺠，1预言家，1女巫，1猎人，1守卫
      **行动顺序**：猫，普狼，守卫，预言家，女巫，猎人
      第三方阵营：猫
    class: lk-center lk-ink
  - text: '*喵。*'
    class: lk-center
  - text: |-
      **猫**
      【夜魅】从第二夜开始，夜间，你行动时，可以「跳跃」一个非村⺠⻆色，全局游戏每个⻆色限选一次。你闭眼后，上帝秘密告知被「跳跃」的⻆色玩家当夜行动时不可以睁眼。然后，当夜此⻆色的行动环节内，你睁眼代替其接收上帝信息并做出行动决定。
    class: lk-ink
  - text: |-
      注：
      （1）猫不是神，不是⺠，也不是狼。
      （2）猫可以代替一名玩家发动其⻆色全局游戏限一次的技能，之后该玩家不可以再发动 此技能。
      （3）即使被「跳跃」的⻆色玩家已经死亡，猫仍然可以在其行动环节内行动并发动其技 能。
      （4）猫「跳跃」尚未使用「解药」的女巫后，若当夜「刀杀」对象为女巫，则上帝告知 猫不可以使用「解药」;若不为女巫，则上帝告知猫可以使用「解药」。
      （5）若猫或守卫选择的「守护」对象上一夜被「守护」，则上帝告知猫或守卫不可以 「守护」此玩家，然后猫或守卫可以改变「守护」对象。
      （6）猫「跳跃」猎人后，当夜若猎人死亡，则猎人不可以发动【神枪】;若猫死亡，则 猫也不可以发动【神枪】。

      胜负判定:
      （1）若所有神死亡，或所有⺠死亡，则狼人阵营获胜。
      （2）若所有狼死亡，则好人阵营获胜。
      （3）若猫存活，且白天某一个时刻场上存活的神、⺠、狼数量相等，则第三方阵营获胜。

      和局条件：若连续两个夜间和白天，或连续两个白天和夜间，均出现下述情况，则上帝宣判和局：（1）夜间狼人行动时没有「刀杀」任何对象，且此夜最终形成平安夜。（2）白天因放逐投票连续平票而没有放逐任何玩家，形成平安日。
    class: lk-ink
  toc: 猫
- id: template66
  number: 66
  name: '鬼蜘蛛<br/><span style="font-weight: normal;">烂柯游艺社第三届原创角色设计大赛 · 一等奖<br/></span><span style="font-weight: 400;">设计者：陈沧皓</span>'
  blocks:
  - anchor: cheater
  - text: |-
      **角色配置**：1⻤蜘蛛，3普狼；4村⺠，1预言家，1女巫，1猎人，1守卫
      **行动顺序**：⻤蜘蛛，⻤蜘蛛和普狼，守卫，预言家，女巫，猎人
    class: lk-center lk-ink
  - text: '*别费力气了。*'
    class: lk-center
  - text: |-
      **⻤蜘蛛 · 狼**
      【狼刀】夜间，你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
      【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
      【魔网】全局游戏限一次。夜间，你单独行动时，可以「笼罩」若干名存活的玩家，「笼罩」数量上限为此时存活的普狼数。若被「笼罩」的玩家当夜成为任何神发动技能的对象， 则该玩家「触网」。下一个夜间，你单独行动时，上帝告知你「触网」玩家的号码，然后 你可以「毒杀」其中任意数量的玩家。
    class: lk-ink
  toc: 鬼蜘蛛
- id: template67
  number: 67
  name: '邪神 vs. 圣徒<br/><span style="font-weight: normal;">烂柯游艺社第三届原创角色设计大赛 · 二等奖<br/></span><span style="font-weight: 400;">设计者：宋彦轲</span>'
  blocks:
  - anchor: cheater
  - text: |-
      **角色配置**：1邪神，3普狼；4村民，1预言家，1女巫，1猎人，1圣徒
      **行动顺序**：邪神，圣徒，普狼，预言家，女巫，猎人
    class: lk-center lk-ink
  - text: |-
      **异常状态：「献祭」关系**
      此关系包括「献祭者」和「被献祭者」 。除非「献祭者」被毒杀，否则当「献祭者」即将死亡时，若「被献祭者」存活，则「献祭者」不会死亡，且上帝公布「被献祭者」的号码。

      注：不同的「献祭」关系中存在各自独立的「献祭者」和「被献祭者」 。
    class: lk-ink
  - text: '*出我先出他*'
    class: lk-center
  - text: |-
      **邪神 · 狼**
      【觉醒】你不可以「自爆」。其他狼人全部死亡后，你获得技能【狼刀】。
      【血祭】全局游戏限一次，夜间，你单独行动时，可以「献祭」一名存活的玩家。你成为「献祭者」，该玩家成为「被献祭者」。
      【血噬】全局游戏限一次，夜间，你单独行动时，可以选择一名玩家，立即解除其所有异常状态。
    class: lk-ink
  - text: '*出她先出我*'
    class: lk-center
  - text: |-
      **圣徒 · 神**
      【圣祭】全局游戏限一次，夜间，你行动时，可以将自己「献祭」给一名存活的玩家。你成为「被献祭者」，该玩家成为「献祭者」 。
      【圣礼】全局游戏限一次，夜间，你单独行动时，可以选择一名玩家，立即解除其所有异常状态。
    class: lk-ink
  toc: 邪神 vs. 圣徒
- id: template68
  number: 68
  name: '复仇女神 vs. 雅典娜<br/><span style="font-weight: normal;">烂柯游艺社第三届原创角色设计大赛 · 二等奖<br/></span><span style="font-weight: 400;">设计者：胡雨章</span>'
  blocks:
  - anchor: cheater
  - text: |-
      **角色配置**：3复仇女神（埃里倪斯），1普狼；4村民，1预言家，1女巫，1猎人，1雅典娜
      **行动顺序**：普狼，埃里倪斯一，埃里倪斯二，埃里倪斯三，预言家，女巫，猎人
    class: lk-center lk-ink
  - text: |-
      *我们将追踪他们，直到他进入地狱，一死也难逃惩处！*
      *“Such we haunt, till beneath Earth he pass. Nay, in death he shall still be none too free!” (The Eumenides, Or The Kindly Goddesses. Lines 330-340.) *
    class: lk-center
  - text: |-
      **复仇女神(Erinyes) · 狼**
      【血仇】从第二夜开始，你可以「标记」一名存活玩家。若所有当夜发动「血仇」的埃里倪斯「标记」同一名玩家，则该玩家成为「击杀」对象。其后，上帝随机决定一名埃里倪斯当夜失去身份底牌，重新获得一张普狼牌，并获知所有埃里倪斯的号码。
      【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
      【魔隐】夜间，你单独行动时，上帝告知你存活的普狼号码。普狼单独行动时，上帝告知其所有埃里倪斯的号码。
    class: lk-ink
  - image: /assets/img/roles/雅典娜.png
  - text: |-
      *阿提卡人民，请听我的法规！*
      *“Hear now my ordinance, people of Athens.” (The Eumenides, Or The Kindly Goddesses. Lines 680-720.) *
    class: lk-center
  - text: |-
      **雅典娜(Athena) · 神**
      【审判】每天限一次，白天发言阶段。你可以于任意玩家发言结束后，翻开底牌并念出“阿提卡人民， 请听我的法规”。若如此做，你可以召开一场审判并召集两名其他存活玩家成为审判对象。审判对象 依照当天的发言顺序依次发言。发言结束后，你可以有 30 秒总结「陈词」。陈词结束后，对该两名 玩家进行一次放逐投票(警长可以归票)。「审判」过程中，你的投票增多 0.5 票的效力。审判结 束后回到之前的发言阶段继续发言。「审判」过程中不能自爆。被「审判」放逐的玩家没有遗言。
      【神力】若你死亡，则你可以翻开此身份牌。若如此做，则你不再参与人间事务。其后，你可以继续留在游戏现场，召开「审判」，但不可以发言、陈词、投票，若你是警长，则警徽流失。
    class: lk-ink
  toc: 复仇女神 vs. 雅典娜
- id: template69
  number: 69
  name: '盗梦幽灵 vs. 驱鬼师<br/><span style="font-weight: normal;">烂柯游艺社第三届原创角色设计大赛 · 二等奖<br/></span><span style="font-weight: 400;">设计者：赵乖巧</span>'
  blocks:
  - anchor: cheater
  - text: |-
      **角色配置**：1盗梦幽灵，3普狼；4村民，1预言家，1女巫，1猎人，1驱鬼师
      **行动顺序**：盗梦幽灵，驱鬼师，普狼和盗梦幽灵，预言家，女巫，猎人
    class: lk-center lk-ink
  - text: '*你猜这里是现实还是梦境？*'
    class: lk-center
  - text: |-
      **盗梦幽灵 · 狼**
      【盗梦】从第二夜开始，夜间，你单独行动时，可以「盗梦」一名存活的玩家。被「盗梦」的玩家当夜将执行上一夜的行动（上帝不会告知被「盗梦」的玩家）。你不可以「盗梦」已经「盗梦」过的玩家。
      【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
    class: lk-ink
  - text: '*破碎吧，不切实际的梦*'
    class: lk-center
  - text: |-
      **驱鬼师 · 神**
      【驱鬼】「盗梦」对你无效。从第二夜开始，夜间，你单独行动时，可以「驱鬼」一名存活的玩家。被「驱鬼」的玩家当夜不受「盗梦」的影响。你不可以「驱鬼」上一夜之前已经「驱鬼」过的玩家。若你连续两夜「驱鬼」同一名玩家，若该玩家是狼人，则该玩家死亡；若该玩家是好人，则你死亡。
    class: lk-ink
  - text: |-
      注：
      （1）被「盗梦」的猎人可以翻牌，但开枪无效。
      （2）被「盗梦」的女巫若当夜使用解药或毒药，则该药未消耗。
    class: lk-ink
  toc: 盗梦幽灵 vs. 驱鬼师
