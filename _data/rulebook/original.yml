- id: template58
  number: 58
  name: '怪人<br/><span style="font-weight: normal;">烂柯游艺社第二届原创角色设计大赛 · 一等奖<br/>设计者：</span><span style="font-weight: 400;">陈沧皓</span>'
  blocks:
  - anchor: weirdo   # 怪人 (laid out as separate blocks, not a role card)
  - text: |-
      **角色配置**：4 [普狼](#werewolf)，1 [怪人](#weirdo)；3 [村民](#villager)，1 [预言家](#seer)，1 [女巫](#witch)，1 [猎人](#hunter)，1 [守卫](#guard)
      **行动顺序**：怪人，普狼，守卫，预言家，女巫，猎人
      **第三方阵营**：怪人
    class: lk-center lk-ink
  - image: /assets/img/roles/怪人.png
  - text: '*你以为这很容易?*'
    class: lk-center
  - text: |-
      **怪人 · 民**
      【偏执】若你被放逐，则第三方立即获胜。当你被预言家「查验」时，上帝告知预言家你为好人。
    class: lk-ink
  - text: |-
      胜负判定：
      （1）当所有神死亡，或所有民死亡时，若第三方阵营没有获胜，则狼人阵营获胜。
      （2）若所有狼死亡，则好人阵营获胜。
      （3）若怪人被放逐，则第三方阵营获胜。
      \
      和局条件:
      若连续两个夜间和白天，或连续两个白天和夜间，均出现下述情况，则上帝宣判和局:
      （1）夜间狼人行动时没有「刀杀」任何对象，且此夜最终形成平安夜。
      （2）白天因放逐投票连续平票而没有放逐任何玩家，形成平安日。
    class: lk-ink
  toc: 怪人
