- id: template9
  number: 9
  name: 梦魇 - 预女猎守
  blocks:
  - anchor: nightmare
  - text: |-
      **角色配置**：1 [梦魇](#nightmare)，3 [普狼](#werewolf)；4 [村民](#villager)，1 [预言家](#seer)，1 [女巫](#witch)，1 [猎人](#hunter)，1 [守卫](#guard)
      **行动顺序**：梦魇，普狼和梦魇，守卫，预言家，女巫，猎人
    class: lk-center lk-ink
  - image: /assets/img/roles/梦魇.png
  - text: '*我就是你的噩梦。*'
    class: lk-center
  - text: |-
      **梦魇** · 狼
      【狼刀】夜间,你和其他存活的狼人行动时，可以「刀杀」一名存活的玩家。
      【首领】你不可以成为「刀杀」对象，也不可以「自爆」。
      【噩梦】夜间，你单独行动时，可以「恐惧」一名存活的玩家。若被「恐惧」的玩家是神，则上帝在其行动时告知其被「恐惧」，然后该神当夜不可以发动技能。若被「恐惧」的玩家是狼人，则上帝在狼人行动时告知所有狼人被「恐惧」的狼人号码，然后狼人当夜不可以「刀杀」任何玩家。你不可以连续两夜「恐惧」同一名玩家。

      注: 即使被「恐惧」的神已经没有技能可以发动，上帝依然告知其被「恐惧」。
    class: lk-ink
  toc: 梦魇-预女猎守
